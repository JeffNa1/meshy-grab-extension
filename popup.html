<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeshyGrab Clone</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #09090b;
      color: #fafafa;
      padding: 16px;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #27272a;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .logo-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-icon {
      font-size: 20px;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      color: #10b981;
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 9999px;
      background: #18181b;
      border: 1px solid #27272a;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #71717a;
    }
    .status-dot.online {
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
    }
    .toggle-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .toggle-bar span {
      color: #d4d4d8;
      font-weight: 500;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #27272a;
      transition: .3s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #10b981;
    }
    input:checked + .slider:before {
      transform: translateX(16px);
    }
    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: #a1a1aa;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .model-list {
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }
    .model-item {
      background: #141416;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .model-details {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
      overflow: hidden;
    }
    .model-name {
      font-weight: 600;
      font-size: 12px;
      color: #fafafa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .model-meta {
      font-size: 11px;
      color: #71717a;
    }
    .btn-download {
      background: #10b981;
      color: #000;
      border: none;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-download:hover {
      background: #34d399;
      transform: translateY(-1px);
    }
    .btn-download:active {
      transform: translateY(0);
    }
    .btn-download.downloaded {
      background: #27272a;
      color: #a1a1aa;
    }
    .btn-batch-all {
      width: 100%;
      background: #10b981;
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 12px;
      transition: background 0.2s;
    }
    .btn-batch-all:hover {
      background: #34d399;
    }
    .empty-state {
      text-align: center;
      padding: 24px 8px;
      color: #71717a;
      font-size: 12px;
      line-height: 1.5;
    }
    .footer-actions {
      display: flex;
      gap: 8px;
    }
    .btn-secondary {
      flex: 1;
      background: #27272a;
      color: #d4d4d8;
      border: 1px solid #3f3f46;
      border-radius: 6px;
      padding: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .btn-secondary:hover {
      background: #3f3f46;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-group">
      <span class="logo-icon">📦</span>
      <span class="title">MeshyGrab Clone</span>
    </div>
    <div id="status-badge" class="status-badge">
      <span id="status-dot" class="status-dot"></span>
      <span id="status-text">Đang check...</span>
    </div>
  </div>

  <div class="toggle-bar">
    <span>⚡ Tự động tải khi mở model:</span>
    <label class="switch">
      <input type="checkbox" id="popup-auto-dl">
      <span class="slider"></span>
    </label>
  </div>

  <div class="section-title">
    <span>DANH SÁCH GLB ĐÃ BẮT</span>
    <span id="count-label" style="color: #10b981;">0 files</span>
  </div>

  <button id="btn-popup-download-all" class="btn-batch-all" style="display: none;">
    ⬇️ TẢI XUỐNG TẤT CẢ (.GLB)
  </button>

  <div id="model-list" class="model-list">
    <div class="empty-state">Chưa bắt dc file nào.<br>Hãy mở model 3D trên Meshy.ai lên!</div>
  </div>

  <div class="footer-actions">
    <button id="btn-open-meshy" class="btn-secondary">🌐 Mở Meshy.ai</button>
    <button id="btn-clear" class="btn-secondary">🗑️ Xóa lịch sử</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
